# =============================================================================
# Docker Compose — Dolibarr ERP/CRM
# =============================================================================
# Usage :
#   1. Configurez vos variables dans le fichier .env
#   2. Lancez l'application :  docker compose up
#   3. Accédez à l'application : http://localhost (ou http://localhost:APP_PORT)
#
# Documentation de l'image officielle :
#   https://hub.docker.com/r/dolibarr/dolibarr
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Base de données MariaDB
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:latest
    container_name: dolibarr-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DOLI_DB_NAME}
      MYSQL_USER: ${DOLI_DB_USER}
      MYSQL_PASSWORD: ${DOLI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Application Dolibarr
  # ---------------------------------------------------------------------------
  web:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr-web
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # Installation automatique au premier démarrage
      DOLI_INSTALL_AUTO: 1
      DOLI_PROD: 1

      # Base de données
      DOLI_DB_TYPE: mysqli
      DOLI_DB_HOST: mariadb
      DOLI_DB_HOST_PORT: 3306
      DOLI_DB_NAME: ${DOLI_DB_NAME}
      DOLI_DB_USER: ${DOLI_DB_USER}
      DOLI_DB_PASSWORD: ${DOLI_DB_PASSWORD}

      # URL racine
      DOLI_URL_ROOT: ${DOLI_URL_ROOT:-http://localhost}

      # Compte administrateur Dolibarr
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN:-admin}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}

      # Société
      DOLI_COMPANY_NAME: ${DOLI_COMPANY_NAME}
      DOLI_COMPANY_COUNTRYCODE: ${DOLI_COMPANY_COUNTRYCODE}

      # Données de démonstration (0 = désactivé, 1 = activé)
      DOLI_INIT_DEMO: ${DOLI_INIT_DEMO:-0}

      # Modules à activer à l'installation (ex: Societe,Facture,Product)
      DOLI_ENABLE_MODULES: ${DOLI_ENABLE_MODULES:-}

      # PHP
      PHP_INI_DATE_TIMEZONE: ${PHP_INI_DATE_TIMEZONE:-Europe/Paris}
      PHP_INI_MEMORY_LIMIT: ${PHP_INI_MEMORY_LIMIT:-256M}
      PHP_INI_UPLOAD_MAX_FILESIZE: ${PHP_INI_UPLOAD_MAX_FILESIZE:-20M}
      PHP_INI_POST_MAX_SIZE: ${PHP_INI_POST_MAX_SIZE:-22M}

    volumes:
      # Fichiers documents Dolibarr (factures, devis, pièces jointes...)
      - dolibarr_documents:/var/www/documents
      # Modules externes / personnalisations
      - dolibarr_custom:/var/www/html/custom

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  # Données de la base de données MariaDB
  db_data:

  # Fichiers générés et uploadés par Dolibarr
  dolibarr_documents:

  # Modules tiers et personnalisations Dolibarr
  dolibarr_custom:
